name: Build and Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Fast, model-free checks. These run BEFORE the image build so a bad node map or a
  # broken handler fails in ~30s instead of after a multi-GB image build.
  # (The in-image checks in the Dockerfile still run — this job is the quick gate.)
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Node map / input-key validation (Item 7a)
        run: python tools/check_node_map.py
      - name: Handler unit tests
        run: |
          pip install --no-cache-dir pytest
          pytest tests/ -q

  build:
    needs: static-checks
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        uses: AdityaGarg8/remove-unwanted-software@v4
        with:
          remove-android: "true"
          remove-dotnet: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-large-packages: "true"
          remove-cached-tools: "true"
          remove-swapfile: "true"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # :latest only ever builds from main, so a canary build on a feature
          # branch (via workflow_dispatch) cannot overwrite what production pulls.
          # Non-main builds publish :canary plus the immutable :${sha}.
          tags: |
            sirdrafton/comfyui-ltx25-serverless:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && 'sirdrafton/comfyui-ltx25-serverless:latest' || 'sirdrafton/comfyui-ltx25-serverless:canary' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
